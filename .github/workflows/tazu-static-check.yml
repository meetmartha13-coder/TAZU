name: TAZU static safety checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check tazu-safety.js
          node --check supabase-client.js
          node --check tazu-config.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No inline application script found")
          for i, script in enumerate(scripts):
              Path(f"/tmp/tazu-inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script(s)")
          PY
          for file in /tmp/tazu-inline-*.js; do node --check "$file"; done
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("tazebid/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No TAZE BID inline application script found")
          for i, script in enumerate(scripts):
              Path(f"/tmp/tazebid-inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} TAZE BID inline script(s)")
          PY
          for file in /tmp/tazebid-inline-*.js; do node --check "$file"; done
