name: Supabase Edge Function checks

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions-check.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-functions-check.yml"

permissions:
  contents: read

jobs:
  typecheck:
    name: Type-check Paystack Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check payment functions
        run: >-
          deno check
          supabase/functions/paystack-initialize/index.ts
          supabase/functions/paystack-verify/index.ts
          supabase/functions/paystack-webhook/index.ts
